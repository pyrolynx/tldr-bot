[project]
name = "tldr-bad-bot"
version = "0.1.0"
description = "Telegram bot for group chat monitoring and AI-powered TLDR summaries"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.15.0",
    "pymongo>=4.9.0",
    "openai>=1.54.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
