services:
  mongodb:
    image: mongo:7-jammy
    container_name: tldr-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db

  bot:
    image: pyrolynx/tldr-bot:0.1.1
    build:
      platforms:
        - "linux/amd64"
        - "linux/arm64"
      context: .
      dockerfile: Dockerfile
    container_name: tldr-bot
    restart: unless-stopped
    depends_on:
      - mongodb
    env_file:
      - path: .env
        required: false
    environment:
      MONGODB_URI: "mongodb://mongodb:27017"
      MONGODB_DATABASE: "tldr_bot"

volumes:
  mongo_data:
